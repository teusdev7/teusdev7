<svg width="900" height="280" viewBox="0 0 900 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1117"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#111827"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#2F81F7"/>
      <stop offset="1" stop-color="#56D364"/>
    </linearGradient>
    <style>
      .title { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: #E6EDF3; }
      .subtitle { font: 500 14px 'Segoe UI', Arial, sans-serif; fill: #9FB3C8; }
      .label { font: 600 13px 'Segoe UI', Arial, sans-serif; fill: #E6EDF3; }
      .small { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #8B9DB2; }
      .hud { font: 700 14px 'Consolas', 'Courier New', monospace; fill: #56D364; }
      .hud2 { font: 700 12px 'Consolas', 'Courier New', monospace; fill: #2F81F7; }
      .mission { font: 600 13px 'Segoe UI', Arial, sans-serif; fill: #DDE7F0; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="900" height="280" rx="22" fill="url(#bg)"/>
  <rect x="18" y="18" width="864" height="244" rx="18" fill="#0B1220" stroke="#1F2937"/>

  <rect x="36" y="34" width="190" height="34" rx="10" fill="#0F172A" stroke="#1F2937"/>
  <text x="54" y="56" class="hud">DEV QUEST MODE</text>
  <rect x="244" y="34" width="112" height="34" rx="10" fill="#0F172A" stroke="#1F2937"/>
  <text x="262" y="56" class="hud2">LEVEL 07</text>
  <rect x="374" y="34" width="150" height="34" rx="10" fill="#0F172A" stroke="#1F2937"/>
  <text x="392" y="56" class="hud2">XP 875 / 1000</text>

  <g filter="url(#shadow)">
    <rect x="36" y="86" width="372" height="148" rx="18" fill="url(#panel)" stroke="#1F2937"/>
  </g>
  <text x="58" y="124" class="title">Dev Quest</text>
  <text x="58" y="148" class="subtitle">Um mini game visual inspirado na minha jornada como desenvolvedor.</text>
  <text x="58" y="168" class="subtitle">Cada missão representa uma habilidade que aplico em projetos reais.</text>

  <text x="58" y="201" class="label">Classe atual:</text>
  <rect x="145" y="185" width="210" height="28" rx="14" fill="#0F172A" stroke="#2F81F7"/>
  <text x="162" y="204" class="hud2">Python Backend Developer</text>

  <text x="58" y="228" class="small">Skills ativas: Automacao • Web Scraping • APIs • Full Stack</text>

  <g filter="url(#shadow)">
    <rect x="432" y="86" width="432" height="148" rx="18" fill="url(#panel)" stroke="#1F2937"/>
  </g>
  <text x="454" y="118" class="label">Missoes em andamento</text>

  <circle cx="462" cy="144" r="6" fill="#56D364"/>
  <text x="478" y="149" class="mission">Automatizar processos e eliminar tarefas manuais</text>

  <circle cx="462" cy="170" r="6" fill="#2F81F7"/>
  <text x="478" y="175" class="mission">Construir APIs e integracoes escalaveis</text>

  <circle cx="462" cy="196" r="6" fill="#F59E0B"/>
  <text x="478" y="201" class="mission">Coletar e estruturar dados com scraping</text>

  <circle cx="462" cy="222" r="6" fill="#A855F7"/>
  <text x="478" y="227" class="mission">Desenvolver dashboards, SaaS e apps full stack</text>

  <rect x="36" y="244" width="828" height="2" fill="#1F2937"/>
  <text x="36" y="267" class="small">STATUS: BUILDING SOLUTIONS THAT TURN PROCESSES, DATA AND IDEAS INTO SOFTWARE.</text>

  <rect x="700" y="38" width="164" height="10" rx="5" fill="#0F172A" stroke="#1F2937"/>
  <rect x="700" y="38" width="140" height="10" rx="5" fill="url(#bar1)"/>
  <text x="700" y="66" class="small">Quest progress</text>
</svg>
